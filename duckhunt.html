<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duck Hunt – CSS animations</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <style>
      /* 1. Sivun perusmuotoilu */
      body {
        min-height: 100vh;
        min-width: 1000px;
        font-family: "Press Start 2P", cursive;
        line-height: 1.7;
      }

      main {
        width: 800px;
        margin: 0 auto;
      }

      .dh {
        width: 200px;
        padding: 10px;
        float: left;
      }

      /* 2. Pelialue: absolute-elementit sijoitetaan tämän sisään */
      .stage {
        position: relative;
        width: 800px;
        height: 481px;
        background: url("img/stage.png") center / contain no-repeat;
        overflow: hidden; /* Karkaava ankka ei näy alueen ulkopuolella */
        cursor: crosshair;
      }

      #output {
        margin-top: 40px;
        padding-left: 30px;
        font-family: monospace;
        font-size: 14px;
        line-height: 1.5;
      }

      .dog {
        position: absolute;
        bottom: 67px;
        left: 15px;
        width: 120px;
        height: 110px;
        background-image: url(img/sprite.png);
        background-position: 0 0;
        animation:
          dogwalk 0.7s steps(5) 0s 5 normal none,
          dogmove 3.5s linear forwards,
          dogsniff 0.5s steps(2) 3.5s 5,
          dogjump 1.5s steps(3) 6s none,
          dogjump2 1.5s linear 6s,
          doglaugh 0.3s steps(2) 7.5s 10 none;
      }

      @keyframes dogwalk {
        from {
          background-position: 0 0;
        }
        to {
          background-position: -600px 0;
        }
      }

      @keyframes dogmove {
        from {
          left: 30px;
        }
        to {
          left: 300px;
        }
      }

      @keyframes dogsniff {
        from {
          background-position: -360px 0;
        }
        to {
          background-position: -600px 0;
        }
      }

      @keyframes dogjump {
        from {
          background-position: 0 -110px;
        }
        to {
          background-position: -360px -110px;
        }
      }

      @keyframes dogjump2 {
       0% {
        transform: translateY(0);
       }
       40% {
        transform: translateY(0);
       }
       70% {
        transform: translateY(-80px);
      }
       90% {
        transform: translateY(-30px);
        opacity: 1;
      }
       100% {
        transform: translateY(0);
        opacity: 0;
      }
      }

      @keyframes doglaugh {
        from {
          background-position: -360px -110px;
        }
        to {
          background-position: -600px -110px;
        }
      }

      .duck1 {
        position: absolute;
        top: 30px;
        left: -80px;
        width: 80px;
        height: 80px;
        background-image: url(img/sprite.png);
        background-position: 0px -220px;
      }

      .duck2 {
        position: absolute;
        top: 30px;
        left: -80px;
        width: 80px;
        height: 80px;
        background-image: url(img/sprite.png);
        background-position: -260px -220px;
      }

      .duck3 {
        position: absolute;
        top: 30px;
        left: -80px;
        width: 80px;
        height: 80px;
        background-image: url(img/sprite.png);
        background-position: -520px -220px;
      }

      .duckflies3 {
        animation:
          flyforward3 10s linear forwards,
          flapforward3 0.4s steps(3) 25;
      }

      .duckleave3 {
        animation:
          flyaway3 1.5s linear forwards,
          flapaway3 0.3s steps(3) 5;
      }

      .duckflies2 {
        animation:
          flyforward2 10s linear forwards,
          flapforward2 0.4s steps(3) 25;
      }

      .duckleave2 {
        animation:
          flyaway2 1.5s linear forwards,
          flapaway2 0.3s steps(3) 5;
      }

      .duckflies1 {
        animation:
          flyforward1 10s linear forwards,
          flapforward 0.4s steps(3) 25;
      }

      .duckleave1 {
        animation:
          flyaway1 1.5s linear forwards,
          flapaway 0.3s steps(3) 5;
      }

      .duckhit1 {
        animation:
          spin1 0.6s steps(2),
          fall1 1.5s linear 0.6s forwards;
      }

      .duckhit2 {
        animation:
          spin2 0.6s steps(2),
          fall2 1.5s linear 0.6s forwards;
      }

      .duckhit3 {
        animation:
          spin3 0.6s steps(2),
          fall3 1.5s linear 0.6s forwards;
      }

      @keyframes fall1 {
        0% {
          opacity: 1;
          background-position: -80px -460px;
        }
        100% {
          top: 300px;
          opacity: 0;
          background-position: -80px -460px;
        }
      }

       @keyframes fall2 {
        0% {
          opacity: 1;
          background-position: -340px -460px;
        }
        100% {
          top: 300px;
          opacity: 0;
          background-position: -340px -460px;
        }
      }

       @keyframes fall3 {
        0% {
          opacity: 1;
          background-position: -600px -460px;
        }
        100% {
          top: 300px;
          opacity: 0;
          background-position: -600px -460px;
        }
      }

      @keyframes spin1 {
        from {
          background-position: 0px -460px;
        }
        to {
          background-position: -160px -460px;
        }
      }

      @keyframes spin2 {
        from {
          background-position: -260px -460px;
        }
        to {
          background-position: -420px -460px;
        }
      }

      @keyframes spin3 {
        from {
          background-position: -520px -460px;
        }
        to {
          background-position: -680px -460px;
        }
      }

      @keyframes flapaway {
        from {
          background-position: 0px -300px;
        }
        to {
          background-position: -240px -300px;
        }
      }

      @keyframes flyaway1 {
        from {
          top: 100px;
          left: 550px;
        }
        to {
          top: -80px;
          left: 800px;
        }
      }

      @keyframes flyforward1 {
        0% {
          top: 30px;
          left: -80px;
        }
        25% {
          top: 100px;
          left: 100px;
        }
        50% {
          top: 30px;
          left: 250px;
        }
        75% {
          top: 160px;
          left: 400px;
        }
        100% {
          top: 100px;
          left: 550px;
        }
      }

      @keyframes flapforward {
        from {
          background-position: 0px -220px;
        }
        to {
          background-position: -240px -220px;
        }
      }

      @keyframes flapaway2 {
        from {
          background-position: -260px -300px;
        }
        to {
          background-position: -500px -300px;
        }
      }

      @keyframes flyaway2 {
        from {
          top: 140px;
          left: 500px;
        }
        to {
          top: -80px;
          left: 800px;
        }
      }

      @keyframes flyforward2 {
        0% {
          top: 30px;
          left: -80px;
        }
        25% {
          top: 200px;
          left: 80px;
        }
        50% {
          top: 60px;
          left: 200px;
        }
        75% {
          top: 100px;
          left: 400px;
        }
        100% {
          top: 140px;
          left: 500px;
        }
      }

      @keyframes flapforward2 {
        from {
          background-position: -260px -220px;
        }
        to {
          background-position: -500px -220px;
        }
      }

      @keyframes flapaway3 {
        from {
          background-position: -520px -300px;
        }
        to {
          background-position: -742px -300px;
        }
      }

      @keyframes flyaway3 {
        from {
          top: 90px;
          left: 600px;
        }
        to {
          top: -80px;
          left: 800px;
        }
      }

      @keyframes flyforward3 {
        0% {
          top: 30px;
          left: -80px;
        }
        25% {
          top: 100px;
          left: 130px;
        }
        50% {
          top: 250px;
          left: 240px;
        }
        75% {
          top: 50px;
          left: 400px;
        }
        100% {
          top: 90px;
          left: 600px;
        }
      }

      @keyframes flapforward3 {
        from {
          background-position: -520px -220px;
        }
        to {
          background-position: -742px -220px;
        }
      }
      /* Tätä luokkaa voi testata selaimen konsolista. */
      .paused {
        animation-play-state: paused;
      }
      .hide {
        visibility: hidden;
      }

      /* Koiran animaatiot */
    </style>
  </head>

  <body>
    <main>
      <h1>Duckhunt Stage</h1>

      <p>
        <img class="dh" src="img/duckhunt.png" alt="" />
        Duck Hunt is a fantastic arcade game that takes inspiration from the
        original classic available on Nintendo game systems. You must shoot the
        moving ducks down with your mouse and see how many points you can score.
        Be sure to avoid shooting your faithful dog!
      </p>

      <div class="stage">
        <div class="dog"></div>
        <div class="duck1"></div>
        <div class="duck2"></div>
        <div class="duck3"></div>
      </div>

      <h2>Animation events</h2>
      <ul id="output"></ul>
    </main>

    <script>
      const dog = document.querySelector(".dog");
      const duck1 = document.querySelector(".duck1");
      const duck2 = document.querySelector(".duck2");
      const duck3 = document.querySelector(".duck3");
      const stage = document.querySelector(".stage");
      const output = document.querySelector("#output");

      // 1. Apufunktio: lisätään viesti tapahtumalokiin.
      function addLog(message) {
        const li = document.createElement("li");
        li.textContent = message;
        output.prepend(li);
      }

      // 2. Seurataan koiran animaatioiden alkua, toistoja ja loppua.
      const animationEvents = [
        "animationstart",
        "animationiteration",
        "animationend",
      ];

      animationEvents.forEach((eventType) => {
        dog.addEventListener(eventType, (event) => {
          addLog(
            `${event.animationName}: ${event.type} ` +
              `(${event.elapsedTime.toFixed(1)} s)`,
          );

          if (
            event.type === "animationend" &&
            event.animationName === "doglaugh"
          ) {
            dog.classList.toggle("hide");
            duck1.classList.toggle("duckflies1");
          }

          // HUOM: animationend laukeaa jokaisesta päättyvästä animaatiosta.
          // Käynnistetään ankka vasta koko hyppysarjan päätyttyä.
        });

        duck1.addEventListener(eventType, (event) => {
          addLog(
            `${event.animationName}: ${event.type} ` +
              `(${event.elapsedTime.toFixed(1)} s)`,
          );

          if (
            event.type === "animationend" &&
            event.animationName === "flyforward1"
          ) {
            duck1.classList.toggle("duckflies1");
            duck1.classList.add("duckleave1");
          }

          if (
            event.type === "animationend" &&
            event.animationName === "flyaway1"
          ) {
            duck2.classList.toggle("duckflies2");
          }
        });

        duck2.addEventListener(eventType, (event) => {
          addLog(
            `${event.animationName}: ${event.type} ` +
              `(${event.elapsedTime.toFixed(1)} s)`,
          );

          if (
            event.type === "animationend" &&
            event.animationName === "flyforward2"
          ) {
            duck2.classList.toggle("duckflies2");
            duck2.classList.add("duckleave2");
          }

          if (
            event.type === "animationend" &&
            event.animationName === "flyaway2"
          ) {
            duck3.classList.toggle("duckflies3");
          }
        });

        duck3.addEventListener(eventType, (event) => {
          addLog(
            `${event.animationName}: ${event.type} ` +
              `(${event.elapsedTime.toFixed(1)} s)`,
          );

          if (
            event.type === "animationend" &&
            event.animationName === "flyforward3"
          ) {
            duck3.classList.toggle("duckflies3");
            duck3.classList.add("duckleave3");
          }
        });
      });

      duck1.addEventListener("click", (event) => {
         if (!duck1.classList.contains("duckflies1")) {
          return;
        }

        // Ankka palaa alkuun joten on lisättävä
        const duckRect = duck1.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();

        const left = duckRect.left - stageRect.left;
        const top = duckRect.top - stageRect.top;

        duck1.style.left = `${left}px`;
        duck1.style.top = `${top}px`;
        duck1.classList.remove("duckflies1");
        duck1.classList.toggle("duckhit1");
        duck2.classList.toggle("duckflies2");
      });

      duck2.addEventListener("click", (event) => {
         if (!duck2.classList.contains("duckflies2")) {
          return;
        }

        // Ankka palaa alkuun joten on lisättävä
        const duckRect = duck2.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();

        const left = duckRect.left - stageRect.left;
        const top = duckRect.top - stageRect.top;

        duck2.style.left = `${left}px`;
        duck2.style.top = `${top}px`;
        duck2.classList.remove("duckflies2");
        duck2.classList.toggle("duckhit2");
        duck3.classList.toggle("duckflies3");
      });

      duck3.addEventListener("click", (event) => {
         if (!duck3.classList.contains("duckflies3")) {
          return;
        }

        // Ankka palaa alkuun joten on lisättävä
        const duckRect = duck3.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();

        const left = duckRect.left - stageRect.left;
        const top = duckRect.top - stageRect.top;

        duck3.style.left = `${left}px`;
        duck3.style.top = `${top}px`;
        duck3.classList.remove("duckflies3");
        duck3.classList.toggle("duckhit3");
      });
      

      // Osuma: jäädytetään ankan tämänhetkinen sijainti ennen
      // lentämisluokan poistamista ja putoamisanimaation aloittamista.
      // duck.addEventListener("click", () => {});

      //  Jos lentoreitti päättyy, ankka on karannut.
      // duck.addEventListener("animationend", (event) => {});

      // Testaa konsolissa:
      // duck.classList.add('paused');    // keskeytä
      // duck.classList.remove('paused'); // jatka
    </script>
  </body>
</html>
